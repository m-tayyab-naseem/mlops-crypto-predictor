name: CD - Test to Master (Production Deployment)

on:
  pull_request:
    branches:
      - main
      - master
    types: [closed]

jobs:
  deploy-production:
    name: Deploy to Production
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow python-dotenv
      
      - name: Fetch best model from MLflow
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          python << EOF
          import mlflow
          from mlflow.tracking import MlflowClient
          import os
          
          # Set tracking URI
          mlflow.set_tracking_uri(os.getenv('MLFLOW_TRACKING_URI'))
          client = MlflowClient()
          
          # Get best run
          experiment = client.get_experiment_by_name("crypto-price-prediction")
          
          if experiment:
              runs = client.search_runs(
                  experiment_ids=[experiment.experiment_id],
                  order_by=["metrics.val_rmse ASC"],
                  max_results=1
              )
              
              if runs:
                  best_run = runs[0]
                  run_id = best_run.info.run_id
                  
                  print(f"Best Run ID: {run_id}")
                  print(f"Model: {best_run.data.params.get('model_type', 'Unknown')}")
                  print(f"Val RMSE: {best_run.data.metrics.get('val_rmse', 'N/A')}")
                  
                  # Download model
                  mlflow.artifacts.download_artifacts(
                      artifact_uri=f"runs:/{run_id}/model",
                      dst_path="./models"
                  )
                  
                  # Download scaler
                  mlflow.artifacts.download_artifacts(
                      artifact_uri=f"runs:/{run_id}/scaler",
                      dst_path="./models"
                  )
                  
                  print("✅ Model and scaler downloaded")
              else:
                  print("⚠️  No runs found")
          else:
              print("⚠️  Experiment not found")
          EOF
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build Docker image
        run: |
          # Get version from git tag or use timestamp
          VERSION=$(git describe --tags --always)
          
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/crypto-predictor:${VERSION} \
            -t ${{ secrets.DOCKER_USERNAME }}/crypto-predictor:latest \
            .
          
          echo "Built image: crypto-predictor:${VERSION}"
      
      - name: Push Docker image
        run: |
          VERSION=$(git describe --tags --always)
          
          docker push ${{ secrets.DOCKER_USERNAME }}/crypto-predictor:${VERSION}
          docker push ${{ secrets.DOCKER_USERNAME }}/crypto-predictor:latest
          
          echo "✅ Pushed images to Docker Hub"
      
      - name: Test Docker container
        run: |
          # Start container
          docker run -d \
            --name crypto-predictor-test \
            -p 8000:8000 \
            ${{ secrets.DOCKER_USERNAME }}/crypto-predictor:latest
          
          # Wait for container to start
          sleep 10
          
          # Health check
          curl -f http://localhost:8000/health || exit 1
          
          # Stop container
          docker stop crypto-predictor-test
          docker rm crypto-predictor-test
          
          echo "✅ Container health check passed"
      
      - name: Deployment Summary
        run: |
          VERSION=$(git describe --tags --always)
          
          echo "🚀 Deployment Summary"
          echo "===================="
          echo "Image: ${{ secrets.DOCKER_USERNAME }}/crypto-predictor:${VERSION}"
          echo "Status: ✅ Deployed"
          echo "PR: #${{ github.event.pull_request.number }}"
          echo "Merged by: ${{ github.event.pull_request.merged_by.login }}"
      
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          body: |
            ## Production Deployment
            
            - Docker Image: `${{ secrets.DOCKER_USERNAME }}/crypto-predictor:latest`
            - PR: #${{ github.event.pull_request.number }}
            - Deployed: ${{ github.event.pull_request.merged_at }}
            
            ### Changes
            ${{ github.event.pull_request.body }}
          draft: false
          prerelease: false